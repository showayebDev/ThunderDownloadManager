version: '3'

vars:
  APP_NAME: "ThunderDownloadManager"
  BIN_DIR: "bin"
  PACKAGE_MANAGER:
    sh: |
      if [ -n "$PACKAGE_MANAGER" ]; then
        echo "$PACKAGE_MANAGER"
      elif bun --version >/dev/null 2>&1 && [ -f frontend/bun.lock -o -f frontend/bun.lockb ]; then
        echo "bun"
      elif pnpm --version >/dev/null 2>&1 && [ -f frontend/pnpm-lock.yaml ]; then
        echo "pnpm"
      elif yarn --version >/dev/null 2>&1 && [ -f frontend/yarn.lock ]; then
        echo "yarn"
      elif npm --version >/dev/null 2>&1 && [ -f frontend/package-lock.json ]; then
        echo "npm"
      elif bun --version >/dev/null 2>&1; then
        echo "bun"
      elif pnpm --version >/dev/null 2>&1; then
        echo "pnpm"
      elif npm --version >/dev/null 2>&1; then
        echo "npm"
      elif yarn --version >/dev/null 2>&1; then
        echo "yarn"
      else
        echo "npm"
      fi
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  ext:
    summary: "Builds universal browser extensions for Chrome, Firefox, and Edge (with .zip and .xpi packages)"
    cmds:
      - |
        if [ "{{.PACKAGE_MANAGER}}" = "bun" ] || (bun --version >/dev/null 2>&1 && ! command -v node >/dev/null 2>&1); then
          bun extension/build.js
        elif [ "{{.PACKAGE_MANAGER}}" = "pnpm" ]; then
          pnpm --prefix frontend build:extension
        elif command -v node >/dev/null 2>&1; then
          node extension/build.js
        elif command -v bun >/dev/null 2>&1; then
          bun extension/build.js
        else
          npm run --prefix frontend build:extension
        fi

  generate_icon:
    summary: "Generates high-resolution application icons, SVGs, and platform icon sets"
    cmds:
      - go run ./build/scripts/generate_icon

  version:sync:
    summary: "Synchronizes version from build/config.yml to Windows, macOS, and Linux configuration files"
    run: once
    cmds:
      - go run ./build/scripts/sync_version {{.VERSION}}

  set:version:
    summary: "Sets and syncs app version across all platforms (Usage: wails3 task set:version VERSION=1.0.1)"
    cmds:
      - go run ./build/scripts/sync_version {{.VERSION}}

  build:
    summary: Builds the application
    deps:
      - task: version:sync
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: "Packages a single universal production installer for Windows (ThunderDM-v<version>-windows-Universal.exe)"
    deps:
      - task: version:sync
    cmds:
      - task: "{{.GOOS}}:package"

  package:all:
    summary: "Packages a single universal production installer for Windows (ThunderDM-v<version>-windows-Universal.exe)"
    deps:
      - task: version:sync
    cmds:
      - task: "{{.GOOS}}:package"

  package:all:platforms:
    summary: "Packages for all operating systems (Windows AMD64/ARM64/Universal, macOS, Linux)"
    deps:
      - task: version:sync
    cmds:
      - task: "package:all"
      - task: "darwin:package"
        vars:
          ARCH: "universal"
      - task: "linux:package"
        vars:
          ARCH: "amd64"
      - task: "linux:package"
        vars:
          ARCH: "arm64"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
