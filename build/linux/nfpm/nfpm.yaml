# Make sure to check the documentation at https://nfpm.goreleaser.com

name: "ThunderDownloadManager"
arch: ${GOARCH}
platform: "linux"
version: "1.0.4"
section: "default"
priority: "extra"
maintainer: "Showayeb https://showayeb.dev/"
description: "Thunder Download Manager - High-performance multi-threaded download manager"
vendor: "Thunder Download Manager"
homepage: "https://github.com/showayebDev/ThunderDownloadManager"
license: "MIT"
release: "1"

contents:
  - src: "./bin/ThunderDownloadManager"
    dst: "/usr/local/bin/ThunderDownloadManager"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/ThunderDownloadManager.png"
  - src: "./build/linux/ThunderDownloadManager.desktop"
    dst: "/usr/share/applications/ThunderDownloadManager.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install and clean removal
scripts:
  preinstall: "./build/linux/nfpm/scripts/preinstall.sh"
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
